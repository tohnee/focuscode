    <style id="theme-vars">
/* FocusCode Mascot Design - Foxglow Terminal Theme */
/* Brand: Fox orange (#ff8700), dark terminal background */

:root {
  /* Brand single hue - foxglow orange */
  --brand: #ff8700;
  --brand-50: #fff7ed;
  --brand-100: #ffedd5;
  --brand-200: #fed7aa;
  --brand-300: #fdba74;
  --brand-400: #fb923c;
  --brand-500: #ff8700;
  --brand-600: #ea6c00;
  --brand-700: #c25000;
  --brand-ink: #1a0a00;

  /* Surfaces - dark terminal */
  --bg: #0d0d12;
  --surface: #151520;
  --surface-2: #1e1e2e;
  --surface-3: #2a2a3e;

  /* Text */
  --ink: #e8e6e3;
  --ink-2: #a8a39b;
  --ink-3: #6b6560;

  /* Borders & lines */
  --line: #2a2a3a;

  /* Semantic state colors */
  --state-success: #5fd75f;
  --state-warning: #ffaf00;
  --state-error: #d75f5f;
  --state-info: #87afd7;

  /* Radius */
  --r-xs: 2px;
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 12px;

  /* Shadows */
  --shadow-1: 0 1px 2px rgba(0,0,0,.3);
  --shadow-2: 0 8px 24px -8px rgba(0,0,0,.5);

  /* Semantic aliases for head contract */
  --focuscode-background: var(--bg);
  --focuscode-foreground: var(--ink);
  --focuscode-card: var(--surface);
  --focuscode-card-foreground: var(--ink);
  --focuscode-popover: var(--surface-2);
  --focuscode-popover-foreground: var(--ink);
  --focuscode-primary: var(--brand);
  --focuscode-primary-foreground: var(--brand-ink);
  --focuscode-muted: var(--surface-2);
  --focuscode-muted-foreground: var(--ink-3);
  --focuscode-border: var(--line);
  --focuscode-input: var(--surface-3);
  --focuscode-ring: var(--brand);
  --focuscode-radius-sm: var(--r-sm);
  --focuscode-radius-md: var(--r-md);
  --focuscode-radius-lg: var(--r-lg);
}

@theme inline {
  --color-brand: var(--brand);
  --color-brand-50: var(--brand-50);
  --color-brand-100: var(--brand-100);
  --color-brand-200: var(--brand-200);
  --color-brand-300: var(--brand-300);
  --color-brand-400: var(--brand-400);
  --color-brand-500: var(--brand-500);
  --color-brand-600: var(--brand-600);
  --color-brand-700: var(--brand-700);

  --color-bg: var(--bg);
  --color-surface: var(--surface);
  --color-surface-2: var(--surface-2);
  --color-surface-3: var(--surface-3);
  --color-ink: var(--ink);
  --color-ink-2: var(--ink-2);
  --color-ink-3: var(--ink-3);
  --color-line: var(--line);

  --color-state-success: var(--state-success);
  --color-state-warning: var(--state-warning);
  --color-state-error: var(--state-error);
  --color-state-info: var(--state-info);
}

/* Terminal font stack */
.font-mono {
  font-family: "JetBrains Mono", "Fira Code", "SF Mono", "Cascadia Code", "Menlo", "Consolas", monospace;
}

/* ASCII art uses mono */
.mascot-art {
  font-family: "JetBrains Mono", "Fira Code", "SF Mono", "Cascadia Code", "Menlo", "Consolas", monospace;
  font-size: 14px;
  line-height: 1.3;
  white-space: pre;
  letter-spacing: 0;
  tab-size: 4;
}

/* Subtle glow for evolution stages */
@keyframes tailGlow {
  0%, 100% { text-shadow: 0 0 4px currentColor; }
  50% { text-shadow: 0 0 12px currentColor, 0 0 24px currentColor; }
}

@keyframes blink {
  0%, 90%, 100% { opacity: 1; }
  95% { opacity: 0; }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

.glow-pulse {
  animation: tailGlow 2s ease-in-out infinite;
}

.float-gentle {
  animation: float 3s ease-in-out infinite;
}

/* Scrollbar for terminal feel */
::-webkit-scrollbar {
  width: 8px;
}
::-webkit-scrollbar-track {
  background: var(--bg);
}
::-webkit-scrollbar-thumb {
  background: var(--surface-3);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--brand);
}
