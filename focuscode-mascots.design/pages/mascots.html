    <title>FocusCode 伙伴图鉴</title>
    <style id="theme-vars">
      /* FocusCode Mascot Design - Foxglow Terminal Theme */
      /* Brand: Fox orange (#ff8700), dark terminal background */

      :root {
        /* Brand single hue - foxglow orange */
        --brand: #ff8700;
        --brand-50: #fff7ed;
        --brand-100: #ffedd5;
        --brand-200: #fed7aa;
        --brand-300: #fdba74;
        --brand-400: #fb923c;
        --brand-500: #ff8700;
        --brand-600: #ea6c00;
        --brand-700: #c25000;
        --brand-ink: #1a0a00;

        /* Surfaces - dark terminal */
        --bg: #0d0d12;
        --surface: #151520;
        --surface-2: #1e1e2e;
        --surface-3: #2a2a3e;

        /* Text */
        --ink: #e8e6e3;
        --ink-2: #a8a39b;
        --ink-3: #6b6560;

        /* Borders & lines */
        --line: #2a2a3a;

        /* Semantic state colors */
        --state-success: #5fd75f;
        --state-warning: #ffaf00;
        --state-error: #d75f5f;
        --state-info: #87afd7;

        /* Radius */
        --r-xs: 2px;
        --r-sm: 4px;
        --r-md: 8px;
        --r-lg: 12px;

        /* Shadows */
        --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.5);

        /* Semantic aliases for head contract */
        --focuscode-background: var(--bg);
        --focuscode-foreground: var(--ink);
        --focuscode-card: var(--surface);
        --focuscode-card-foreground: var(--ink);
        --focuscode-popover: var(--surface-2);
        --focuscode-popover-foreground: var(--ink);
        --focuscode-primary: var(--brand);
        --focuscode-primary-foreground: var(--brand-ink);
        --focuscode-muted: var(--surface-2);
        --focuscode-muted-foreground: var(--ink-3);
        --focuscode-border: var(--line);
        --focuscode-input: var(--surface-3);
        --focuscode-ring: var(--brand);
        --focuscode-radius-sm: var(--r-sm);
        --focuscode-radius-md: var(--r-md);
        --focuscode-radius-lg: var(--r-lg);
      }

      @theme inline {
        --color-brand: var(--brand);
        --color-brand-50: var(--brand-50);
        --color-brand-100: var(--brand-100);
        --color-brand-200: var(--brand-200);
        --color-brand-300: var(--brand-300);
        --color-brand-400: var(--brand-400);
        --color-brand-500: var(--brand-500);
        --color-brand-600: var(--brand-600);
        --color-brand-700: var(--brand-700);

        --color-bg: var(--bg);
        --color-surface: var(--surface);
        --color-surface-2: var(--surface-2);
        --color-surface-3: var(--surface-3);
        --color-ink: var(--ink);
        --color-ink-2: var(--ink-2);
        --color-ink-3: var(--ink-3);
        --color-line: var(--line);

        --color-state-success: var(--state-success);
        --color-state-warning: var(--state-warning);
        --color-state-error: var(--state-error);
        --color-state-info: var(--state-info);
      }

      /* Terminal font stack */
      .font-mono {
        font-family:
          "JetBrains Mono", "Fira Code", "SF Mono", "Cascadia Code", "Menlo", "Consolas", monospace;
      }

      /* ASCII art uses mono */
      .mascot-art {
        font-family:
          "JetBrains Mono", "Fira Code", "SF Mono", "Cascadia Code", "Menlo", "Consolas", monospace;
        font-size: 14px;
        line-height: 1.3;
        white-space: pre;
        letter-spacing: 0;
        tab-size: 4;
      }

      /* Subtle glow for evolution stages */
      @keyframes tailGlow {
        0%,
        100% {
          text-shadow: 0 0 4px currentColor;
        }
        50% {
          text-shadow:
            0 0 12px currentColor,
            0 0 24px currentColor;
        }
      }

      @keyframes blink {
        0%,
        90%,
        100% {
          opacity: 1;
        }
        95% {
          opacity: 0;
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }

      .glow-pulse {
        animation: tailGlow 2s ease-in-out infinite;
      }

      .float-gentle {
        animation: float 3s ease-in-out infinite;
      }

      /* Scrollbar for terminal feel */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--surface-3);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--brand);
      }
    </style>

    <style id="watercolor-mascot-styles">
      /* Watercolor mascot page styles */
      body {
        background: var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif;
      }

      /* Terminal chrome */
      .term-window {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        overflow: hidden;
      }
      .term-titlebar {
        background: var(--surface-2);
        border-bottom: 1px solid var(--line);
        padding: 8px 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--ink-3);
      }
      .term-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
      }
      .term-body {
        padding: 24px;
      }

      /* Cards */
      .mascot-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        padding: 20px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        position: relative;
        overflow: hidden;
      }
      .mascot-card:hover {
        border-color: var(--brand);
        box-shadow: 0 0 20px rgba(255, 135, 0, 0.08);
      }
      .evo-card {
        text-align: center;
      }
      .comp-card {
        text-align: center;
      }

      /* Art containers */
      .art-container {
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 12px auto;
        position: relative;
      }
      .art-container.evo {
        min-height: 160px;
      }
      .art-container.comp {
        min-height: 130px;
      }
      .evo-svg {
        display: block;
        max-width: 160px;
        max-height: 140px;
        width: 100%;
        height: auto;
      }
      .companion-svg {
        display: block;
        max-width: 120px;
        max-height: 110px;
        width: 100%;
        height: auto;
      }

      /* Level badges */
      .lv-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 999px;
        letter-spacing: 0.5px;
        font-family: "JetBrains Mono", monospace;
      }

      /* Fox glow and float animations */
      @keyframes foxGlowPulse {
        0%,
        100% {
          filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.3));
        }
        50% {
          filter: drop-shadow(0 0 14px rgba(255, 215, 0, 0.6))
            drop-shadow(0 0 24px rgba(255, 175, 0, 0.3));
        }
      }
      .fox-glow {
        animation: foxGlowPulse 3s ease-in-out infinite;
      }
      @keyframes floaty {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }
      .fox-float {
        animation: floaty 4s ease-in-out infinite;
      }

      /* Mood pills */
      .mood-pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid;
        font-family: "JetBrains Mono", monospace;
      }
      .mood-row {
        display: flex;
        gap: 6px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      /* Catchphrase */
      .catchphrase {
        font-size: 12px;
        color: var(--ink-2);
        font-style: italic;
        margin-top: 8px;
      }

      /* Section headers */
      .section-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }
      .section-header .term-prompt {
        color: var(--brand);
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
      }
      .section-header h2 {
        font-size: 20px;
        font-weight: 700;
        color: var(--ink);
      }

      /* Code block */

      // 核心设计：歪头 + 超大圆眼 + 高光星星眼 + 自然卷曲大毛刷尾巴 + 软糯身体
      function foxSVG(f) {
        const animClass = (f.glow ? " fox-glow" : "") + (f.flt ? " fox-float" : "");
        const auraColor = f.lv >= 7 ? f.light : f.lv >= 4 ? f.body : f.dark;
        const auraOpacity = f.lv >= 8 ? 0.22 : f.lv >= 5 ? 0.15 : 0.08;

        // ---- 尾巴：手绘自然卷毛刷 ----
        // 单尾从身体左侧绕上来形成大C形卷曲；多尾扇形展开，每根都是独立的贝塞尔曲线
        function oneTail(
          d,
          startX,
          startY,
          cp1x,
          cp1y,
          cp2x,
          cp2y,
          endX,
          endY,
          col,
          tipCol,
          tipStart,
          thick,
          glowCol,
        ) {
          // thick 是尾巴根部宽度，末端会自然收窄；用多道描边叠加模拟毛量
          let out = "";
          // 阴影底层（水彩晕染）
          out += `<path d="M${startX},${startY} C${cp1x},${cp1y} ${cp2x},${cp2y} ${endX},${endY}" stroke="${glowCol || col}" stroke-width="${thick * 1.8}" fill="none" stroke-linecap="round" opacity="0.12" filter="url(#wc-wash)"/>`;
          // 主体毛色（粗描边+水彩滤镜）
          out += `<path d="M${startX},${startY} C${cp1x},${cp1y} ${cp2x},${cp2y} ${endX},${endY}" stroke="${col}" stroke-width="${thick}" fill="none" stroke-linecap="round" opacity="0.92" filter="url(#wc-soft)"/>`;
          // 浅色高光（沿尾巴上缘的细描边，营造立体毛感）
          out += `<path d="M${startX},${startY - 1} C${cp1x},${cp1y - 2} ${cp2x},${cp2y - 2} ${endX},${endY - 1}" stroke="${f.light}" stroke-width="${thick * 0.35}" fill="none" stroke-linecap="round" opacity="0.5" filter="url(#wc-soft)"/>`;
          // 白色尾尖：从 tipStart 比例处开始换色——简单做法是画一个棉球
          const t = tipStart;
          // 估算尾尖位置：在贝塞尔曲线上 t 位置
          const t1x = startX + (cp1x - startX) * t,
            t1y = startY + (cp1y - startY) * t;
          const t2x = cp1x + (cp2x - cp1x) * t,
            t2y = cp1y + (cp2y - cp1y) * t;
          const t3x = cp2x + (endX - cp2x) * t,
            t3y = cp2y + (endY - cp2y) * t;
          const m1x = t1x + (t2x - t1x) * t,
            m1y = t1y + (t2y - t1y) * t;
          const m2x = t2x + (t3x - t2x) * t,
            m2y = t2y + (t3y - t2y) * t;
          const tipX = m1x + (m2x - m1x) * t,
            tipY = m1y + (m2y - m1y) * t;
          // 白色尾尖棉球（3个重叠圆，毛茸茸）
          out += `<circle cx="${tipX}" cy="${tipY}" r="${thick * 0.7}" fill="${tipCol}" opacity="0.9" filter="url(#wc-soft)"/>`;
          out += `<circle cx="${tipX + thick * 0.3}" cy="${tipY - thick * 0.2}" r="${thick * 0.45}" fill="${tipCol}" opacity="0.7" filter="url(#wc-soft)"/>`;
          out += `<circle cx="${tipX - thick * 0.25}" cy="${tipY + thick * 0.3}" r="${thick * 0.4}" fill="#ffffff" opacity="0.5" filter="url(#wc-soft)"/>`;
          return out;
        }

        let tails = "";
        const n = f.tails;
        const baseX = 82,
          baseY = 105; // 尾巴从身体左侧偏后处长出

        if (n === 1) {
          // 经典大C卷尾：从后腰向左上方大弧度绕到头顶旁
          tails += oneTail(
            0,
            baseX,
            baseY,
            40,
            110,
            20,
            70,
            45,
            35,
            f.body,
            f.tip,
            0.55,
            14,
            f.light,
          );
          // 尾巴边缘毛丛碎感
          tails += `<circle cx="30" cy="55" r="4" fill="${f.body}" opacity="0.5" filter="url(#wc-soft)"/>`;
          tails += `<circle cx="22" cy="48" r="3" fill="${f.tip}" opacity="0.6" filter="url(#wc-soft)"/>`;
        } else {
          // 多尾扇形：从同一点长出，角度从-150°(左下)到-30°(右上)均匀展开
          // 每根尾巴是独立S曲线，外侧尾巴稍长
          const startDeg = -160,
            endDeg = -20;
          for (let i = 0; i < n; i++) {
            const t = n === 1 ? 0.5 : i / (n - 1);
            const deg = startDeg + (endDeg - startDeg) * t;
            const rad = (deg * Math.PI) / 180;
            const edgeBias = Math.abs(t - 0.5) * 2;
            const len = 55 + edgeBias * 15 + Math.min(f.lv * 2, 12);
            const thick = n <= 3 ? 11 : n <= 5 ? 9 : n <= 7 ? 7.5 : 6.5;
            // 自然S曲线：控制点偏移
            const cp1dist = len * 0.35;
            const cp2dist = len * 0.75;
            const curveOut = (t < 0.5 ? -1 : 1) * (8 + edgeBias * 12);
            const cp1x =
              baseX + Math.cos(rad) * cp1dist + Math.cos(rad + Math.PI / 2) * curveOut * 0.3;
            const cp1y =
              baseY + Math.sin(rad) * cp1dist + Math.sin(rad + Math.PI / 2) * curveOut * 0.3;
            const cp2x = baseX + Math.cos(rad) * cp2dist + Math.cos(rad + Math.PI / 2) * curveOut;
            const cp2y =
              baseY +
              Math.sin(rad) * cp2dist +
              Math.sin(rad + Math.PI / 2) * curveOut -
              (1 - edgeBias) * 8;
            const endX = baseX + Math.cos(rad) * len + Math.cos(rad + Math.PI / 2) * curveOut * 0.8;
            const endY =
              baseY +
              Math.sin(rad) * len +
              Math.sin(rad + Math.PI / 2) * curveOut * 0.8 -
              (1 - edgeBias) * 10;
            tails += oneTail(
              i,
              baseX,
              baseY,
              cp1x,
              cp1y,
              cp2x,
              cp2y,
              endX,
              endY,
              f.body,
              f.tip,
              0.5,
              thick,
              f.light,
            );
          }
          // Lv5+ 尾根金色辉光洗色
          if (f.lv >= 5) {
            tails += `<ellipse cx="${baseX - 5}" cy="${baseY - 5}" rx="25" ry="20" fill="${f.light}" opacity="0.1" filter="url(#wc-wash)"/>`;

        </g>`;

        if (f.flair === "aura") {

          for (let i = 0; i < 9; i++) {
            const a = (i * Math.PI * 2) / 9;

        if (f.flair === "divine") {

        // ---- 眼睛：超大圆眼+双高光+星星眼（高等级） ----

                <circle cx="${eyeRX_pos - 2}" cy="${eyeY + 3}" r="1" fill="#fff" opacity="0.5"/>`;
          // Lv8+ 眼睛有星形高光
          if (f.lv >= 8) {
            eyes += `<text x="${eyeLX - 5}" y="${eyeY - 5}" font-size="8" fill="#fff" opacity="0.8">✦</text>

        // ---- 额印 ----
        let fmark = "";
        if (f.fmark === "dot") {
          fmark = `<ellipse cx="90" cy="44" rx="2.8" ry="2" fill="#d46020" opacity="0.75" filter="url(#wc-soft)"/>`;

        if (f.fmark === "dia") {
          fmark = `<path d="M90,39 L93.5,45 L90,51 L86.5,45 Z" fill="#f0a830" opacity="0.85" filter="url(#wc-soft)"/>`;
        }
        if (f.fmark === "star") {
          fmark = `<text x="84" y="51" font-size="12" fill="#f0c040" opacity="0.85">✦</text>`;
        }
        if (f.fmark === "star2") {
          fmark = `<text x="82" y="51" font-size="15" fill="#f0d060" opacity="0.9" filter="url(#wc-glow)">✦</text>`;
        }
        if (f.fmark === "crystal") {
          fmark = `<path d="M90,34 L96,44 L93,54 L87,54 L84,44 Z" fill="#fff0c0" opacity="0.85" filter="url(#wc-glow)"/>
                 <path d="M90,36 L94,44 L90,50 L86,44 Z" fill="#ffffff" opacity="0.6"/>`;
        }
        if (f.fmark === "radiant") {
          fmark = `<circle cx="90" cy="44" r="4.5" fill="#fff8c0" opacity="0.85" filter="url(#wc-glow)"/>
                 <text x="81" y="50" font-size="18" fill="#ffd860" opacity="0.75" filter="url(#wc-glow)">✦</text>`;

        }

        // ---- 头部歪头：通过 g 元素 rotate(-5deg) 实现 ----
        const headTilt = f.lv <= 2 ? -6 : -4; // 低等级歪头更明显=更萌

        return `<svg viewBox="0 0 180 160" class="evo-svg${animClass}" xmlns="http://www.w3.org/2000/svg">

        ${flair}

        ${chestFluff}
        ${paws}
        <!-- 歪头的头部组 -->
        <g transform="rotate(${headTilt},90,68)">
          <!-- 头部（圆润贝塞尔，不是正圆，略扁） -->
          <path d="M63,68 Q60,42 90,38 Q120,42 117,68 Q118,85 90,88 Q62,85 63,68 Z" fill="${f.body}" opacity="0.96" filter="url(#wc-soft)"/>

          <ellipse cx="90" cy="77" rx="3" ry="2.2" fill="#2a1000" opacity="0.85"/>

          <path d="M54,61 Q60,65 66,61" stroke="#6a5848" stroke-width="1.1" fill="none" stroke-linecap="round" opacity="0.55"/>
          <!-- 淡腮红 -->
          <ellipse cx="42" cy="55" rx="3.5" ry="2" fill="#d8a090" opacity="0.22" filter="url(#wc-soft)"/>
          <ellipse cx="78" cy="55" rx="3.5" ry="2" fill="#d8a090" opacity="0.22" filter="url(#wc-soft)"/>
        </g>
        <!-- 咖啡杯（小只捧着） -->
        <rect x="84" y="72" width="13" height="14" rx="2.5" fill="#8a6848" opacity="0.88" filter="url(#wc-soft)"/>
        <ellipse cx="90.5" cy="72" rx="6.5" ry="1.8" fill="#6a4828" opacity="0.75"/>
        <path d="M97,76 Q103,76 103,81 Q103,85 97,85" stroke="#8a6848" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.85"/>
        <!-- 咖啡热气 -->
        <path d="M88,68 Q90,63 88,58" stroke="#fff" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.25"/>
        <path d="M93,68 Q95,63 93,58" stroke="#fff" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.25"/>
      </svg>`;
      }

      const compSVGGenerators = {
        foxy: foxyCompSVG,
        mochi: mochiSVG,
        byte: byteSVG,
        nori: noriSVG,
        pico: picoSVG,
        bubu: bubuSVG,
        kumo: kumoSVG,
      };

      // ========== MOOD FACE SVG (tiny) ==========
      function moodFaceSVG(color) {
        // Returns a generic tiny cute face shape; the actual expression is conveyed by the unicode char in the pill
        return `<svg viewBox="0 0 32 24" width="32" height="24" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="16" cy="13" rx="13" ry="10" fill="${color}" opacity="0.15" filter="url(#wc-soft)"/>
        <circle cx="11" cy="11" r="2" fill="${color}" opacity="0.8"/>
        <circle cx="21" cy="11" r="2" fill="${color}" opacity="0.8"/>
        <path d="M12,16 Q16,19 20,16" stroke="${color}" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.7"/>
      </svg>`;
      }

      // ========== RENDER FUNCTIONS ==========
      function renderEvoGrid() {
        const g = document.getElementById("evo-grid");
        g.innerHTML = foxLevels
          .map((f) => {
            const badgeStyle = `background:${f.badge}; color:${f.btxt};`;
            return `<div class="mascot-card evo-card">
          <span class="lv-badge" style="${badgeStyle}">LV ${f.lv}</span>
          <div class="stage-name">${f.name}</div>
          <div class="art-container evo">${foxSVG(f)}</div>
          <div class="flavor">${f.desc}</div>
        </div>`;
          })
          .join("");
      }

      function renderCompGrid() {
        const g = document.getElementById("comp-grid");
        g.innerHTML = companions
          .map((c) => {
            const moodsHTML = moods
              .slice(0, 4)
              .map((m) => {
                return `<span class="mood-pill" style="color:${c.moodc}; border-color:${c.moodc}33; background:${c.moodc}10;">${m.face} ${m.label}</span>`;
              })
              .join("");
            return `<div class="mascot-card comp-card">
          <div class="species-tag">${c.species}</div>
          <div style="font-size:15px; font-weight:700; color:var(--ink); margin-bottom:4px;">${c.name}</div>
          <div class="art-container comp">${compSVGGenerators[c.id]()}</div>
          <div class="mood-row">${moodsHTML}</div>
          <div class="catchphrase">${c.catch}</div>
        </div>`;
          })
          .join("");
      }

      function renderMoodTable() {
        const tb = document.getElementById("mood-tbody");
        tb.innerHTML = moods
          .map((m) => {
            return `<tr>
          <td style="color:${m.color}; font-weight:600; font-family:'JetBrains Mono',monospace;">${m.label}</td>
          <td style="font-size:18px; text-align:center;">${moodFaceSVG(m.color)}<div style="font-size:12px; color:${m.color}; margin-top:2px;">${m.face}</div></td>
          <td style="color:var(--ink-2); font-size:12px;">${m.desc}</td>
          <td style="color:${m.color}; font-size:13px; white-space:nowrap;">${m.energy}</td>
        </tr>`;
          })
          .join("");
      }

      function renderSpec() {
        const spec = `{
  <span class="cmt">// 渲染技术</span>
  <span class="kw">"rendering"</span>: <span class="str">"SVG + 水彩滤镜"</span>,
  <span class="kw">"filters"</span>: {
    <span class="kw">"wc-soft"</span>:   <span class="str">"GaussianBlur(0.8) + Turbulence Disp(2)"</span>,
    <span class="kw">"wc-wash"</span>:   <span class="str">"GaussianBlur(2) + Turbulence Disp(4) 湿边晕染"</span>,
    <span class="kw">"wc-paper"</span>:  <span class="str">"fractalNoise 纸张纹理"</span>,
    <span class="kw">"wc-glow"</span>:   <span class="str">"GaussianBlur(4) + Merge 光晕"</span>
  },

  <span class="cmt">// 画框规格</span>
  <span class="kw">"viewBox"</span>: {
    <span class="kw">"evolution"</span>:   <span class="str">"0 0 180 160"</span>,   <span class="cmt">// 九尾狐进化卡</span>
    <span class="kw">"companion"</span>:   <span class="str">"0 0 120 110"</span>,   <span class="cmt">// 伙伴图鉴卡</span>
    <span class="kw">"mood-face"</span>:  <span class="str">"0 0 32 24"</span>      <span class="cmt">// 心情微表情</span>
  },

  <span class="cmt">// 色彩系统</span>
  <span class="kw">"color"</span>: {
    <span class="kw">"principle"</span>: <span class="str">"per-species primary + cream/white accents"</span>,
    <span class="kw">"fill"</span>:       <span class="str">"radialGradient 水彩晕染 (中心亮→边缘深)"</span>,
    <span class="kw">"opacity"</span>:    <span class="str">"0.7~0.95 多层叠色营造通透感"</span>,
    <span class="kw">"palette"</span>: {
      <span class="kw">"foxy"</span>:   <span class="str">"#ff8700 orange → #ffd860 gold → #fff8e0 divine"</span>,
      <span class="kw">"mochi"</span>:  <span class="str">"#f5c6d6 pink cloud"</span>,
      <span class="kw">"byte"</span>:   <span class="str">"#5fd75f cyber green"</span>,
      <span class="kw">"nori"</span>:   <span class="str">"#7de8c8 mint axolotl"</span>,
      <span class="kw">"pico"</span>:   <span class="str">"#87afd7 ice blue"</span>,
      <span class="kw">"bubu"</span>:   <span class="str">"#d4a574 cream brown"</span>,
      <span class="kw">"kumo"</span>:   <span class="str">"#b8a898 zen gray"</span>
    }
  },

  <span class="cmt">// 动画</span>
  <span class="kw">"animation"</span>: {
    <span class="kw">"foxGlowPulse"</span>: <span class="str">"3s ease-in-out infinite (Lv7+ 光晕脉动)"</span>,
    <span class="kw">"floaty"</span>:       <span class="str">"4s ease-in-out infinite (Lv8+ 浮空微动)"</span>,
    <span class="kw">"blink"</span>:        <span class="str">"1s step-end (终端光标)"</span>
  },

  <span class="cmt">// 进化维度</span>
  <span class="kw">"evolution"</span>: {
    <span class="kw">"tails"</span>:     <span class="str">"${1}→${9} 扇形展开"</span>,
    <span class="kw">"color-shift"</span>: <span class="str">"orange → gold → white-gold (Lv8+)"</span>,
    <span class="kw">"particles"</span>:  <span class="str">"sparkle → orb → stars → aura → divine mist"</span>,
    <span class="kw">"forehead"</span>:   <span class="str">"dot(Lv3) → ◆(Lv5) → ✦(Lv6) → crystal(Lv8) → radiant(Lv9)"</span>,
    <span class="kw">"eyes"</span>:      <span class="str">"solid black → amber iris → gold iris → luminous"</span>
  },

  <span class="cmt">// 萌系核心原则</span>
  <span class="kw">"cuteness"</span>: [
    <span class="str">"big eyes (2 highlights per eye: 1 big + 1 tiny)"</span>,
    <span class="str">"pink blush circles on cheeks (#ff9999 low opacity)"</span>,
    <span class="str">"chibi proportions: head ~60% of body, stubby limbs"</span>,
    <span class="str">"fluffy curved tails with soft gradient tips"</span>,
    <span class="str">"rounded shapes everywhere, no sharp edges except pixel fox"</span>,
    <span class="str">"layered translucent fills for watercolor depth"</span>
  ]
}`;
        document.getElementById("spec-block").innerHTML = spec;
      }

      // ========== INIT ==========
      renderEvoGrid();
      renderCompGrid();
      renderMoodTable();
      renderSpec();
    </script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
